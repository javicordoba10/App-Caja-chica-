<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistema de Gestión y Rendición de Fondos Fijos (Caja Chica)">
  <meta name="app-version" content="v30.5-ULTRA">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Caja Chica">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Caja Chica - Gestión y Rendición de Gastos</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Carga diferida de librerías secundarias para máxima velocidad de inicio -->
  <script defer src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.12.313/build/pdf.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script type="text/javascript">
    async function performWebOCR(base64Data, isPdf) {
      try {
        let imageDataUrl = 'data:image/png;base64,' + base64Data;
        
        if (isPdf) {
          try {
            if (typeof pdfjsLib !== 'undefined') {
              window.PDFJS = pdfjsLib;
              pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@2.12.313/build/pdf.worker.js";
            }
            const res = await fetch('data:application/pdf;base64,' + base64Data);
            const blob = await res.blob();
            const arrayBuffer = await blob.arrayBuffer();
            const uint8Array = new Uint8Array(arrayBuffer);
            
            const loadingTask = pdfjsLib.getDocument({data: uint8Array});
            const pdf = await loadingTask.promise;
            const page = await pdf.getPage(1);
            const viewport = page.getViewport({scale: 2.5}); 
            
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            
            await page.render({ canvasContext: context, viewport: viewport }).promise;
            imageDataUrl = canvas.toDataURL('image/jpeg', 0.8);
          } catch (pdfErr) {
            console.error('PDF Conversion Error:', pdfErr);
            return '[OCR PDF ERROR] ' + pdfErr.toString();
          }
        }

        try {
          console.log('Starting Tesseract.js worker...');
          const worker = await Tesseract.createWorker('spa');
          const result = await worker.recognize(imageDataUrl);
          console.log('Tesseract.js OCR complete.');
          await worker.terminate();
          
          if (!result || !result.data || !result.data.text) {
             console.error('OCR returned no text.');
             return '[OCR EMPTY ERROR] No se detectó texto en el documento.';
          }
          return result.data.text;
        } catch (tessErr) {
          console.error('Tesseract Error:', tessErr);
          return '[OCR TESSERACT ERROR] ' + tessErr.toString();
        }
      } catch (e) {
        console.error('OCR Global Error:', e);
        return '[OCR GLOBAL ERROR] ' + e.toString();
      }
    }
  </script>
  <style>
    #cookie-consent-banner {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(24, 24, 27, 0.94);
      backdrop-filter: blur(8px);
      color: #f4f4f5;
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      z-index: 99999;
      max-width: 90%;
      width: 640px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-sizing: border-box;
    }
    #cookie-consent-banner button {
      background: #e65100;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    #cookie-consent-banner button:hover {
      background: #f57c00;
    }
  </style>
</head>
<body>
  <div id="cookie-consent-banner" style="display: none;">
    <span>Utilizamos almacenamiento local y cookies técnicas estrictamente necesarias para el inicio de sesión y la operatividad contable, garantizando la privacidad de tus datos.</span>
    <button onclick="acceptCookieConsent()">Entendido</button>
  </div>
  <script>
    function checkCookieConsent() {
      try {
        if (!localStorage.getItem('petty_cash_cookie_consent')) {
          document.getElementById('cookie-consent-banner').style.display = 'flex';
        }
      } catch (e) {}
    }
    function acceptCookieConsent() {
      try {
        localStorage.setItem('petty_cash_cookie_consent', 'true');
        document.getElementById('cookie-consent-banner').style.display = 'none';
      } catch (e) {}
    }
    window.addEventListener('load', checkCookieConsent);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
